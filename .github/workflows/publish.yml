---
name: Publish to TER

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish new version to TER
    uses: astehlik/typo3-extension-buildtools/.github/workflows/extension-publish.yml@TYPO3_14
    with:
      extension-key: tinyurls
    secrets:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
